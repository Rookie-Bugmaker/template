# 可作为PLSM专用容器的default.conf；若与主平台共用18090，仅合并下面/sub/plsm相关location。
server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 只向微前端加载器开放静态资源，不代理API，也不传递跨域Cookie。
    add_header Access-Control-Allow-Origin "*" always;

    location = /sub/plsm {
        return 301 /sub/plsm/;
    }

    location = /sub/plsm/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /sub/plsm/ {
        index index.html;
        # Vue Router使用history路由，功能页刷新必须回到子应用index，而非主平台index。
        try_files $uri $uri/ /sub/plsm/index.html;

        # 缺失分包必须返回404，不能返回HTML伪装为JS/CSS，否则难以发现发布漏文件。
        location ~* \.(?:js|css|map|json|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
        }
    }

    # 此容器只提供子应用静态文件。主平台根路径与/api仍由18090入口服务器处理。
    location / {
        return 404;
    }
}
